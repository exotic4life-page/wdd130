<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Get in touch with White Water Rafting Co. Find our address, phone number, email, and location, or send us a message about trips, reservations, or the website.">
    <meta name="author" content="Chidiebere Agbo">
    <title>Contact Us - White Water Rafting Co.</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Co. logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html" aria-current="page">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="contact-intro">
            <h1>White Water Rafting Company</h1>
            <address>
                123 Main River Street<br>
                Kolob, California<br>
                <a href="tel:+19999999999">+1 999 999 9999</a><br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>
        </section>

        <!-- Map and contact form section -->
        <section class="contact-main">

            <div class="map-embed">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3305.0!2d-121.5!3d37.3!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDE4JzAwLjAiTiAxMjHCsDMwJzAwLjAiVw!5e0!3m2!1sen!2sus!4v0000000000000"
                  width="400" height="320" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"
                  title="Map showing the location of White Water Rafting Co.">
                </iframe>
            </div>

            <form action="#" method="post" class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <fieldset class="message-purpose">
                    <legend>Message Purpose</legend>

                    <label>
                        <input type="radio" name="purpose" value="general-inquiry" checked>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation-question">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website-suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here" rows="5"
                      required></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>

        </section>

        <!-- Employee profiles section -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">
                <figure>
                    <img src="images/employee-1.jpg" alt="Photo of Head River Guide">
                    <figcaption>Head River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-2.jpg" alt="Photo of Reservations Manager">
                    <figcaption>Reservations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-3.jpg" alt="Photo of Safety Coordinator">
                    <figcaption>Safety Coordinator</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting Co. | Chidiebere Agbo</p>

        <nav class="socialmedia" aria-label="Social media links">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>

            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>

            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
